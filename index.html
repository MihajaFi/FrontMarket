<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre du site -->
    <title>MarketPlace - Boutique en ligne</title>

    <!-- SEO -->
    <meta
      name="description"
      content="MarketPlace est votre boutique en ligne pour acheter des produits de qualité : électronique, mode, accessoires et plus encore. Livraison rapide et paiement sécurisé."
    />
    <meta name="keywords" content="e-commerce, boutique en ligne, achat, produits, vente, marketplace, shopping" />
    <meta name="author" content="MarketPlace" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="MarketPlace - Boutique en ligne" />
    <meta
      property="og:description"
      content="Découvrez des milliers de produits au meilleur prix. Commandez facilement et recevez rapidement chez vous."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarketPlace - Boutique en ligne" />
    <meta
      name="twitter:description"
      content="Achetez en ligne facilement : produits fiables, paiement sécurisé et livraison rapide."
    />
    <meta name="twitter:image" content="/images/og-image.png" />
  </head>

  <body>
    <noscript>
      Ce site e-commerce nécessite JavaScript pour fonctionner correctement.
    </noscript>
  <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
